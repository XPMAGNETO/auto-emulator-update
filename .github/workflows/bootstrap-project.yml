name: Bootstrap v10.1 Project

on:
  push:
    branches: [ main ]
    paths:
      - '.bootstrap/**'
      - '.github/workflows/bootstrap-project.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  unpack-project:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Expand project payload
        shell: bash
        run: |
          set -euo pipefail
          test -f .bootstrap/payload.zip
          tmp="$(mktemp -d)"
          decoded="$(mktemp --suffix=.zip)"
          base64 -d .bootstrap/payload.zip > "$decoded"
          unzip -t "$decoded"
          unzip -q "$decoded" -d "$tmp"
          find . -mindepth 1 -maxdepth 1 ! -name .git ! -name .bootstrap ! -name .github -exec rm -rf {} +
          cp -a "$tmp"/. ./
          rm -rf .bootstrap
          rm -f .github/workflows/bootstrap-project.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: import Auto Emulator Update v10.1 Easy Setup Edition"
          git push origin main
