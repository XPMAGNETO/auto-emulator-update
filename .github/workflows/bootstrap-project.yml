name: Bootstrap v10.1 Project

on:
  push:
    branches: [ main ]
    paths:
      - '.bootstrap/run'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  unpack-project:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Expand project payload
        shell: bash
        run: |
          set -euo pipefail
          parts=(
            .bootstrap/payload.part00
            .bootstrap/payload.part01
            .bootstrap/payload.part02
            .bootstrap/payload.part03
            .bootstrap/payload.part04
            .bootstrap/payload.part05
            .bootstrap/payload.part06
            .bootstrap/payload.part07
            .bootstrap/payload.part08a
            .bootstrap/payload.part08b
            .bootstrap/payload.part08c0
            .bootstrap/payload.part08c1
            .bootstrap/payload.part08c2
            .bootstrap/payload.part08c3
            .bootstrap/payload.part09
            .bootstrap/payload.part10
            .bootstrap/payload.part11
          )
          for part in "${parts[@]}"; do test -f "$part"; done
          cat "${parts[@]}" | base64 -d > /tmp/project.zip
          actual_sha="$(sha256sum /tmp/project.zip | awk '{print $1}')"
          expected_sha="1231457a911f16b28952b8b2d0c06fd7b7e60256cc46d7d3e588d456856baf30"
          test "$actual_sha" = "$expected_sha"
          unzip -t /tmp/project.zip
          tmp="$(mktemp -d)"
          unzip -q /tmp/project.zip -d "$tmp"
          project_root="$tmp/AutoEmulatorUpdate-v10.1-EasySetup"
          test -d "$project_root"
          find . -mindepth 1 -maxdepth 1 ! -name .git ! -name .bootstrap -exec rm -rf {} +
          cp -a "$project_root"/. ./
          sed -i 's#OWNER/auto-emulator-update#xpm69420/auto-emulator-update#g' src/AutoEmulatorUpdate.Core/BuildInfo.cs
          sed -i 's#actions/checkout@v4#actions/checkout@v5#g' .github/workflows/*.yml
          rm -rf .bootstrap
          rm -f .github/workflows/bootstrap-project.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: import Auto Emulator Update v10.1 Easy Setup Edition"
          git push origin main
