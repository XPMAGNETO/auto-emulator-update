name: Bootstrap v10.1 Project

on:
  push:
    branches: [ main ]
    paths:
      - '.bootstrap/run'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  unpack-project:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Expand project payload
        shell: bash
        run: |
          set -euo pipefail
          parts=(.bootstrap/payload.part*)
          test ${#parts[@]} -ge 12
          cat "${parts[@]}" | base64 -d > /tmp/project.zip
          unzip -t /tmp/project.zip
          tmp="$(mktemp -d)"
          unzip -q /tmp/project.zip -d "$tmp"
          project_root="$tmp/AutoEmulatorUpdate-v10.1-EasySetup"
          test -d "$project_root"
          find . -mindepth 1 -maxdepth 1 ! -name .git ! -name .bootstrap -exec rm -rf {} +
          cp -a "$project_root"/. ./
          sed -i 's#OWNER/auto-emulator-update#xpm69420/auto-emulator-update#g' src/AutoEmulatorUpdate.Core/BuildInfo.cs
          rm -rf .bootstrap
          rm -f .github/workflows/bootstrap-project.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: import Auto Emulator Update v10.1 Easy Setup Edition"
          git push origin main
