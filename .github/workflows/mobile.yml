name: Mobile Builds

on:
  push:
    branches: [ main ]
    paths:
      - 'src/AutoEmulatorUpdate.Mobile/**'
      - 'src/AutoEmulatorUpdate.Mobile.Android/**'
      - 'src/AutoEmulatorUpdate.Mobile.iOS/**'
      - '.github/workflows/mobile.yml'
      - 'Directory.Build.props'
      - 'global.json'
  pull_request:
    paths:
      - 'src/AutoEmulatorUpdate.Mobile/**'
      - 'src/AutoEmulatorUpdate.Mobile.Android/**'
      - 'src/AutoEmulatorUpdate.Mobile.iOS/**'
      - '.github/workflows/mobile.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  DOTNET_VERSION: '10.0.x'
  DOTNET_CLI_TELEMETRY_OPTOUT: '1'
  DOTNET_NOLOGO: '1'

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
      - name: Install Android workload
        run: dotnet workload install android
      - name: Build Android companion
        run: dotnet publish src/AutoEmulatorUpdate.Mobile.Android -c Release -p:AndroidPackageFormats=apk
      - name: Upload installable Android APK
        uses: actions/upload-artifact@v4
        with:
          name: AutoEmulatorUpdater-Android
          path: src/AutoEmulatorUpdate.Mobile.Android/bin/Release/net10.0-android/**/*.apk
          if-no-files-found: error
          retention-days: 14

  ios:
    runs-on: macos-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
      - name: Install iOS workload
        run: dotnet workload install ios
      - name: Build iOS companion without signing
        run: dotnet build src/AutoEmulatorUpdate.Mobile.iOS -c Release -p:CodesignKey=- -p:CodesignProvision=-
      - name: Upload unsigned iOS verification bundle
        uses: actions/upload-artifact@v4
        with:
          name: AutoEmulatorUpdater-iOS-Unsigned
          path: src/AutoEmulatorUpdate.Mobile.iOS/bin/Release/net10.0-ios/**/*.app
          if-no-files-found: error
          retention-days: 14
